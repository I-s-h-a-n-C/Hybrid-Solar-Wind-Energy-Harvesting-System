<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
<title id="title">Hybrid solar and wind generator: conceptual energy flow</title>
<desc id="desc">Four small solar panels and a helical vertical-axis wind turbine each feed separate five-volt converters and isolation diodes. Their outputs enter a shared low-voltage input feeding a lithium battery charging and power-bank module, with USB-C output. This is a functional block diagram, not a validated wiring schematic.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="1200" height="390" rx="20" fill="#101f32"/>
<text x="38" y="47" fill="#f1f5f9" font-family="Arial,sans-serif" font-size="25" font-weight="700">Two sources. One buffered output.</text>
<text x="39" y="73" fill="#97abc4" font-family="Arial,sans-serif" font-size="14">Functional overview from the prototype wiring drawing; component ratings and power-path compatibility require verification.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="36" y="115" width="201" height="79" rx="12" fill="#183c42" stroke="#48d5c0" stroke-width="2"/>
<text x="136" y="146" font-size="20" font-weight="700" fill="#e8fffc">Solar array</text>
<text x="136" y="171" font-size="14" fill="#b4e8df">4 small panels · DC</text>
<rect x="36" y="236" width="201" height="79" rx="12" fill="#3d3020" stroke="#f8bb63" stroke-width="2"/>
<text x="136" y="267" font-size="20" font-weight="700" fill="#fff3dc">Helical VAWT</text>
<text x="136" y="292" font-size="14" fill="#f3d5a5">Motor used as generator</text>
<rect x="292" y="115" width="170" height="79" rx="12" fill="#1c344f" stroke="#7ba5d8" stroke-width="1.8"/>
<text x="377" y="146" font-size="17" font-weight="700" fill="#f1f5f9">5 V converter</text>
<text x="377" y="171" font-size="13" fill="#bbd0ed">Solar branch</text>
<rect x="292" y="236" width="170" height="79" rx="12" fill="#1c344f" stroke="#7ba5d8" stroke-width="1.8"/>
<text x="377" y="267" font-size="17" font-weight="700" fill="#f1f5f9">5 V converter</text>
<text x="377" y="292" font-size="13" fill="#bbd0ed">Wind branch</text>
<rect x="531" y="160" width="169" height="107" rx="12" fill="#263650" stroke="#adc2dd" stroke-width="1.8"/>
<text x="615" y="192" font-size="18" fill="#ffffff" font-weight="700">Isolation +</text>
<text x="615" y="216" font-size="18" fill="#ffffff" font-weight="700">5 V combining</text>
<text x="615" y="245" font-size="13" fill="#b8c9dd">Schottky diodes</text>
<rect x="772" y="160" width="192" height="107" rx="12" fill="#1b3a49" stroke="#70c4de" stroke-width="1.8"/>
<text x="868" y="192" font-size="17" font-weight="700" fill="#f0fdff">Battery-bank</text>
<text x="868" y="216" font-size="17" font-weight="700" fill="#f0fdff">electronics</text>
<text x="868" y="245" font-size="13" fill="#c7e9f2">LiPo storage / output</text>
<rect x="1031" y="160" width="135" height="107" rx="12" fill="#23423e" stroke="#61c7b3" stroke-width="2"/>
<text x="1098" y="203" font-size="20" font-weight="700" fill="#effff9">USB-C</text>
<text x="1098" y="230" font-size="14" fill="#bcefe5">Low-voltage load</text>
