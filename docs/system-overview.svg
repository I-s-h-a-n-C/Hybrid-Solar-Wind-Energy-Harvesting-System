<text x="38" y="350" fill="#e9bd76" font-family="Arial,sans-serif" font-size="14" font-weight="700">DESIGN NOTE</text>
<text x="156" y="350" fill="#c0cede" font-family="Arial,sans-serif" font-size="14">A converter label does not guarantee startup at the wind generator's low input voltage.</text>
<text x="38" y="372" fill="#97abc4" font-family="Arial,sans-serif" font-size="12">Not a pin-level schematic, charger certification, or permission to connect unverified lithium-cell hardware.</text>
